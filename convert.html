<!DOCTYPE html>
<html lang="ar">
<head><meta charset="UTF-8"><title>تنزيل icon1-512.png</title></head>
<body style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; background:#333;">

    <div id="svgContainer">
        <!-- ضع كود الـ SVG أعلاه هنا -->
    </div>

    <button onclick="downloadPNG()" style="margin-top:20px; padding:12px 24px; font-size:18px; background:#d97706; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">
        تنزيل الصورة icon1-512.png 🚀
    </button>

    <script>
        function downloadPNG() {
            const svgElement = document.querySelector('svg');
            const svgString = new XMLSerializer().serializeToString(svgElement);
            const img = new Image();
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 512, 512);
                
                const pngUrl = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngUrl;
                downloadLink.download = 'icon1-512.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
            };
            img.src = url;
        }
    </script>
</body>
</html>
