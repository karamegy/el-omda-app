<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تحويل وتنزيل أيقونة العلاف icon1-512.png</title>
    <meta name="theme-color" content="#b45309">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0c0a09;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
        }
        .container-box {
            background: #1c1917;
            border: 2px solid #b45309;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .preview-card {
            width: 256px;
            height: 256px;
            margin: 20px auto;
            border-radius: 40px;
            overflow: hidden;
            border: 3px solid #fde047;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            background: #292524;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .file-input-btn {
            background: #292524;
            border: 1px dashed #b45309;
            padding: 12px;
            border-radius: 10px;
            color: #fde047;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-weight: bold;
            display: block;
        }
        .btn-download {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            background: linear-gradient(135deg, #b45309, #d97706);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
            margin-bottom: 10px;
        }
        .btn-download:hover {
            background: linear-gradient(135deg, #d97706, #f59e0b);
        }
        .nav-back {
            display: inline-block;
            margin-top: 15px;
            color: #fde047;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .nav-back:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container-box">
        <h3 style="color: #fde047; margin-top: 0;">🖼️ صانع أيقونة تطبيق العلاف (512x512)</h3>
        <p style="font-size: 0.85rem; color: #a8a29e;">اختر صورة اللوجو لتأطيرها وتحويلها فوراً إلى <code>icon1-512.png</code> متوافقة مع النظام السحابي الجديد</p>

        <label class="file-input-btn">
            📁 اضغط هنا لاختيار صورة اللوجو من جهازك
            <input type="file" id="imageUploader" accept="image/*" style="display: none;" onchange="loadImage(event)">
        </label>

        <div class="preview-card">
            <img id="logoPreview" src="https://images.unsplash.com/photo-1595246140625-573b715d11dc?w=500" alt="معاينة اللوجو">
        </div>

        <button class="btn-download" onclick="generateAndDownload()">تنزيل الصورة icon1-512.png 🚀</button>
        <a href="index.html" class="nav-back">← العودة إلى المتجر الرئيسي 🌾</a>
    </div>

    <!-- إعداد وتهيئة Firebase السحابية ومزامنة الحساب (مشروع alaf-93848) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLgvF-u77h-RwSSaJPLx4x-U3ZLOtuvrM",
            authDomain: "alaf-93848.firebaseapp.com",
            projectId: "alaf-93848",
            storageBucket: "alaf-93848.firebasestorage.app",
            messagingSenderId: "984757380320",
            appId: "1:984757380320:web:247065b2434c002c445c85",
            measurementId: "G-ESV2GNSQZ4"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.auth = getAuth(app);
        window.googleProvider = new GoogleAuthProvider();
        window.signInWithPopup = signInWithPopup;
        window.firebaseModules = { doc, getDoc, setDoc };

        console.log("🛠️🚀 تم ربط أداة تحويل الأيقونات ببيانات فايربيس السحابية بنجاح!");
    </script>

    <script>
        function loadImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('logoPreview');
                output.src = reader.result;
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function generateAndDownload() {
            const img = document.getElementById('logoPreview');
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // رسم خلفية وأيقونة بمقاس 512x512 دقيق
            ctx.drawImage(img, 0, 0, 512, 512);

            const pngUrl = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = pngUrl;
            downloadLink.download = 'icon1-512.png';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
