<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنزيل icon1-512.png - تطبيق العلاف</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #12100e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
        }
        .preview-title {
            color: #fde047;
            margin-bottom: 15px;
            font-size: 1.3rem;
            text-align: center;
        }
        .preview-box {
            width: 320px;
            height: 320px;
            background: #1c1917;
            border: 2px solid #b45309;
            border-radius: 24px;
            padding: 12px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-box svg {
            width: 100%;
            height: 100%;
        }
        .btn-download {
            margin-top: 25px;
            padding: 14px 32px;
            font-size: 18px;
            background: linear-gradient(135deg, #b45309, #d97706);
            color: #fff;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 18px rgba(217, 119, 6, 0.4);
            transition: all 0.2s ease;
        }
        .btn-download:hover {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            transform: translateY(-2px);
        }
        .btn-download:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h3 class="preview-title">معاينة لوجو العلاف المطور (512x512) 🌾🐄🐎🐑🐐</h3>

    <!-- حاوية اللوجو مدمج بها كود الـ SVG المتطور -->
    <div id="svgContainer" class="preview-box">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
          <defs>
            <!-- التدرجات اللونية الفاخرة -->
            <radialGradient id="bgGrad" cx="50%" cy="45%" r="55%">
              <stop offset="0%" stop-color="#451a03"/>
              <stop offset="60%" stop-color="#1c1917"/>
              <stop offset="100%" stop-color="#0c0a09"/>
            </radialGradient>
            
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="35%" stop-color="#fde047"/>
              <stop offset="70%" stop-color="#d97706"/>
              <stop offset="100%" stop-color="#78350f"/>
            </linearGradient>

            <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="100%" stop-color="#d6d3d1"/>
            </linearGradient>

            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
            </filter>
          </defs>

          <!-- الخلفية والإطار الخارجي -->
          <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
          <circle cx="256" cy="256" r="232" fill="none" stroke="url(#goldGrad)" stroke-width="10" filter="url(#glow)"/>
          <circle cx="256" cy="256" r="218" fill="none" stroke="#fde047" stroke-width="2" stroke-dasharray="6 6" opacity="0.5"/>

          <!-- 1. إطار خلفية الحبوب وسنابل القمح (مركز اللوجو) -->
          <g filter="url(#glow)">
            <!-- سنابل القمح خلفية أعلى الشعار -->
            <path d="M 256 180 L 256 50 M 256 70 L 240 55 M 256 70 L 272 55 M 256 95 L 235 80 M 256 95 L 277 80 M 256 120 L 232 105 M 256 120 L 280 105 M 256 145 L 230 130 M 256 145 L 282 130" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" fill="none"/>
            <path d="M 230 190 Q 180 130 150 70 M 165 90 L 145 75 M 180 110 L 160 95 M 195 130 L 175 115" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
            <path d="M 282 190 Q 332 130 362 70 M 347 90 L 367 75 M 332 110 L 352 95 M 317 130 L 337 115" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" fill="none"/>
          </g>

          <!-- 2. الحيوانات والأعلاف (دائرة المزرعة المترابطة) -->
          <g filter="url(#glow)">
            <!-- أ) الخيل (أعلى اليسار) -->
            <g transform="translate(115, 120) scale(0.75)">
              <!-- خيال الخيل -->
              <path d="M 45 10 C 25 10, 10 30, 5 50 C 0 65, 12 80, 25 80 C 40 80, 55 65, 60 45 C 65 30, 60 10, 45 10 Z" fill="url(#goldGrad)"/>
              <path d="M 12 25 Q -5 40 5 65 Q 18 50 30 45 Q 22 30 12 25 Z" fill="#1c1917"/>
              <circle cx="32" cy="32" r="3" fill="url(#goldGrad)"/>
            </g>

            <!-- ب) البقر (أعلى اليمين) -->
            <g transform="translate(315, 120) scale(0.75)">
              <!-- رأس البقرة والقرون -->
              <path d="M 20 15 C 5 5, -5 20, 5 30 C 15 35, 25 25, 20 15 Z" fill="url(#goldGrad)"/>
              <path d="M 60 15 C 75 5, 85 20, 75 30 C 65 35, 55 25, 60 15 Z" fill="url(#goldGrad)"/>
              <path d="M 15 30 Q 40 20 65 30 Q 75 60 40 80 Q 5 60 15 30 Z" fill="url(#goldGrad)"/>
              <ellipse cx="40" cy="65" rx="18" ry="10" fill="#1c1917"/>
            </g>

            <!-- ج) الأغنام (أسفل اليسار) -->
            <g transform="translate(125, 230) scale(0.7)">
              <!-- صوف وجسم الخروف -->
              <circle cx="30" cy="30" r="18" fill="url(#silverGrad)"/>
              <circle cx="48" cy="25" r="15" fill="url(#silverGrad)"/>
              <circle cx="20" cy="45" r="14" fill="url(#silverGrad)"/>
              <circle cx="42" cy="48" r="16" fill="url(#silverGrad)"/>
              <!-- وجه الخروف -->
              <path d="M 45 28 C 45 45, 62 45, 62 28 C 62 18, 45 18, 45 28 Z" fill="#1c1917"/>
              <circle cx="52" cy="26" r="2" fill="#fff"/>
            </g>

            <!-- د) الماعز (أسفل اليمين) -->
            <g transform="translate(310, 230) scale(0.7)">
              <!-- قرون الماعز الملتوية وجهه -->
              <path d="M 25 25 C 10 5, -5 20, 12 35 Z" fill="url(#goldGrad)"/>
              <path d="M 45 25 C 60 5, 75 20, 58 35 Z" fill="url(#goldGrad)"/>
              <path d="M 20 30 L 50 30 L 42 70 L 28 70 Z" fill="url(#goldGrad)"/>
              <!-- اللحية -->
              <path d="M 32 70 L 35 85 L 38 70 Z" fill="url(#goldGrad)"/>
            </g>

            <!-- هـ) وعاء حبوب العلاف والذرة (في المنتصف) -->
            <g transform="translate(206, 210)">
              <!-- شكارة / كيس الأعلاف والحبوب -->
              <path d="M 10 40 C 10 20, 90 20, 90 40 C 100 80, 85 110, 50 110 C 15 110, 0 80, 10 40 Z" fill="#b45309" stroke="url(#goldGrad)" stroke-width="4"/>
              <path d="M 18 28 C 30 35, 70 35, 82 28 C 88 15, 12 15, 18 28 Z" fill="#78350f" stroke="url(#goldGrad)" stroke-width="3"/>
              <!-- حبوب الذرة والقمح البارزة من الكيس -->
              <circle cx="35" cy="18" r="6" fill="#fde047"/>
              <circle cx="50" cy="12" r="7" fill="#fde047"/>
              <circle cx="65" cy="18" r="6" fill="#fde047"/>
              <circle cx="42" cy="22" r="5" fill="#fef08a"/>
              <circle cx="58" cy="22" r="5" fill="#fef08a"/>
            </g>
          </g>

          <!-- 3. الشريط السفلي الذهبي الفاخر للاسم -->
          <g filter="url(#glow)">
            <!-- خلفية الوشاح/اللافتة -->
            <path d="M 90 380 L 150 395 L 362 395 L 422 380 L 402 445 L 362 435 L 150 435 L 110 445 Z" fill="#78350f" stroke="url(#goldGrad)" stroke-width="3"/>
            <path d="M 130 390 L 382 390 L 372 430 L 140 430 Z" fill="url(#goldGrad)"/>

            <!-- نص اسم التطبيق -->
            <text x="256" y="422" text-anchor="middle" font-family="'Segoe UI', 'Cairo', sans-serif" font-weight="900" font-size="34" fill="#1c1917">العلاف</text>
            <!-- الوصف الفرعي -->
            <text x="256" y="465" text-anchor="middle" font-family="'Segoe UI', 'Cairo', sans-serif" font-weight="bold" font-size="17" fill="#fde047" letter-spacing="1.5">الأعلاف والحبوب والخدمات الزراعية</text>
          </g>
        </svg>
    </div>

    <button class="btn-download" onclick="downloadPNG()">تنزيل الصورة icon1-512.png 🚀</button>

    <script>
        function downloadPNG() {
            const svgElement = document.querySelector('svg');
            const svgString = new XMLSerializer().serializeToString(svgElement);
            const img = new Image();
            const svgBlob = new Blob([svgString], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            img.onload = function () {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 512;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, 512, 512);
                
                const pngUrl = canvas.toDataURL('image/png');
                const downloadLink = document.createElement('a');
                downloadLink.href = pngUrl;
                downloadLink.download = 'icon1-512.png';
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                URL.revokeObjectURL(url);
            };
            img.src = url;
        }
    </script>
</body>
</html>
