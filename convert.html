<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة تحويل وتنزيل أيقونة العلاف icon1-512.png</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0c0a09;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
            box-sizing: border-box;
        }
        .container-box {
            background: #1c1917;
            border: 2px solid #b45309;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .preview-card {
            width: 256px;
            height: 256px;
            margin: 20px auto;
            border-radius: 40px;
            overflow: hidden;
            border: 3px solid #fde047;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            background: #292524;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .preview-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .file-input-btn {
            background: #292524;
            border: 1px dashed #b45309;
            padding: 12px;
            border-radius: 10px;
            color: #fde047;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-weight: bold;
        }
        .btn-download {
            width: 100%;
            padding: 14px;
            font-size: 17px;
            background: linear-gradient(135deg, #b45309, #d97706);
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.4);
        }
        .btn-download:hover {
            background: linear-gradient(135deg, #d97706, #f59e0b);
        }
    </style>
</head>
<body>

    <div class="container-box">
        <h3 style="color: #fde047; margin-top: 0;">🖼️ صانع أيقونة التطبيق الرسمية (512x512)</h3>
        <p style="font-size: 0.85rem; color: #a8a29e;">اختر صورة اللوجو الواقعي لتأطيرها وتحويلها فوراً إلى `icon1-512.png`</p>

        <label class="file-input-btn">
            📁 اضغط هنا لاختيار صورة اللوجو من جهازك
            <input type="file" id="imageUploader" accept="image/*" style="display: none;" onchange="loadImage(event)">
        </label>

        <div class="preview-card">
            <img id="logoPreview" src="https://images.unsplash.com/photo-1595246140625-573b715d11dc?w=500" alt="معاينة اللوجو">
        </div>

        <button class="btn-download" onclick="generateAndDownload()">تنزيل الصورة icon1-512.png 🚀</button>
    </div>

    <script>
        function loadImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('logoPreview');
                output.src = reader.result;
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        function generateAndDownload() {
            const img = document.getElementById('logoPreview');
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // رسم خلفية وأيقونة بمقاس 512x512 دقيق
            ctx.drawImage(img, 0, 0, 512, 512);

            const pngUrl = canvas.toDataURL('image/png');
            const downloadLink = document.createElement('a');
            downloadLink.href = pngUrl;
            downloadLink.download = 'icon1-512.png';
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
