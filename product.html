                <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 2px;">

            <a href="Map.html" class="nav-btn" style="background: #10b981; color: #fff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold;"><i class="fa-solid fa-map-location-dot"></i> الخريطة الحية</a>
            <a href="admin.html" id="adminPanelLink" class="nav-btn" style="background: #dc2626; color: #fff; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; display: none; font-weight: bold;"><i class="fa-solid fa-lock"></i> لوحة التحكم</a>

        </div>

    <!-- نظام الحماية ضد الاختراق والسكربتات الخبيثة -->
    <script>
        function sanitizeInput(str) {
            if (typeof str !== 'string') return str;
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }
    </script>

    <!-- إعداد وتهيئة Firebase السحابية الآمنة ومزامنة الحساب (مشروع alaf-93848) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCLgvF-u77h-RwSSaJPLx4x-U3ZLOtuvrM",
            authDomain: "alaf-93848.firebaseapp.com",
            projectId: "alaf-93848",
            storageBucket: "alaf-93848.firebasestorage.app",
            messagingSenderId: "984757380320",
            appId: "1:984757380320:web:247065b2434c002c445c85",
            measurementId: "G-ESV2GNSQZ4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.auth = getAuth(app);
        window.googleProvider = new GoogleAuthProvider();
        window.signInWithPopup = signInWithPopup;
        window.firebaseModules = { 
            collection, 
            getDocs, 
            doc, 
            getDoc,
            setDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot, 
            query, 
            where 
        };

        document.addEventListener('DOMContentLoaded', () => {
            const sessionUser = JSON.parse(
                localStorage.getItem('allaf_logged_user') || 
                localStorage.getItem('fleet_logged_user') || 
                localStorage.getItem('fleet_session_user') || 
                localStorage.getItem('fleet_current_cust') || '{}'
            );
            
            const avatarEl = document.getElementById('nav-user-avatar');
            const nameEl = document.getElementById('nav-username-display');
            const adminLink = document.getElementById('adminPanelLink');

            if (sessionUser && (sessionUser.name || sessionUser.email)) {
                if (nameEl) nameEl.innerText = sanitizeInput(sessionUser.name || sessionUser.email || sessionUser.phone);
                if (avatarEl && sessionUser.photoURL) avatarEl.src = sessionUser.photoURL;

                // إظهار رابط لوحة التحكم للمشرفين
                if (sessionUser.role === 'admin' || sessionUser.role === 'manager' || sessionUser.email === 'haretg@gmail.com' || sessionUser.email === 'admin@allaf.com') {
                    if (adminLink) adminLink.style.display = 'inline-flex';
                }
            } else {
                if (nameEl) nameEl.innerText = 'زائر';
            }
        });

        console.log("🛡️🚀 تم تحديث صفحة تفاصيل المنتج (product.html) وربطها بنجاح مع مشروع فايربيس الجديد alaf-93848!");
    </script>

    <!-- ملف الجافاسكربت الشامل للتطبيق -->
    <script src="app.js"></script>
</body>
