<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المنتج | كبابجي ومشويات العمدة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#b45309">
</head>
<body style="background-color: #f5f5f4; font-family: 'Cairo', sans-serif; padding: 20px;">
    
    <header class="main-header" style="margin-bottom: 25px;">
        <div class="logo-container">
            <a href="index.html" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-arrow-right"></i>
                <h1>العودة للمنيو الرئيسي</h1>
            </a>
        </div>
    </header>

    <main style="max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <div id="product-detail-container">
            <!-- سيتم تحميل تفاصيل المنتج ديناميكياً هنا -->
        </div>
    </main>

    <script src="app.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            
            const products = JSON.parse(localStorage.getItem('omda_custom_products') || JSON.stringify(defaultProducts));
            const product = products.find(p => p.id === productId);

            const container = document.getElementById('product-detail-container');
            if(!product) {
                container.innerHTML = '<p style="text-align:center; padding:40px; color:#78716c; font-size:1.1rem;">عذراً، المنتج المطلوب غير موجود أو تم حذفه.</p>';
                return;
            }

            const mediaSrc = product.media || product.image || 'https://images.unsplash.com/photo-1544025162-d76694265947?w=500';
            const isVid = product.mediaType === 'video' || (typeof mediaSrc === 'string' && mediaSrc.startsWith('data:video'));
            
            let mediaHtml = isVid 
                ? `<video src="${mediaSrc}" controls autoplay loop style="width:100%; max-height:450px; object-fit:cover; border-radius:12px; margin-bottom:20px;"></video>`
                : `<img src="${mediaSrc}" alt="${product.name}" style="width:100%; max-height:450px; object-fit:cover; border-radius:12px; margin-bottom:20px;">`;

            container.innerHTML = `
                ${mediaHtml}
                <h1 style="color: #292524; font-size: 2rem; margin-bottom: 10px;">${product.name}</h1>
                <div style="font-size: 1.5rem; color: #b45309; font-weight: bold; margin-bottom: 15px;">${product.price} جنيه</div>
                <p style="color: #57534e; font-size: 1.1rem; line-height: 1.7; margin-bottom: 25px; background: #fafaf9; padding: 15px; border-radius: 10px;">${product.desc}</p>
                
                <div style="display: flex; gap: 15px; align-items: center; border-top: 1px solid #e7e5e4; padding-top: 20px;">
                    <label style="font-weight: bold; color: #292524;">الكمية:</label>
                    <input type="number" id="detail-qty" value="1" min="1" style="width: 80px; padding: 10px; border: 1px solid #d6d3d1; border-radius: 8px; text-align: center; font-size: 1rem; font-weight: bold;">
                    <button onclick="addSpecificProductToCart(${product.id})" class="btn-primary" style="flex: 1; background-color: #b45309; padding: 12px; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; border: none; font-size: 1.05rem;">
                        <i class="fa-solid fa-cart-plus"></i> أضف للسلة وانتقل لإتمام الطلب 🛒
                    </button>
                </div>
            `;
        });

        function addSpecificProductToCart(id) {
            const qtyInput = document.getElementById('detail-qty');
            const qty = qtyInput ? parseInt(qtyInput.value) || 1 : 1;
            
            const products = JSON.parse(localStorage.getItem('omda_custom_products') || JSON.stringify(defaultProducts));
            const prod = products.find(p => p.id === id);
            if(!prod) return;

            let existing = cart.find(item => item.id === id);
            if(existing) {
                existing.qty += qty;
            } else {
                cart.push({ ...prod, qty: qty });
            }
            updateCartUI();
            alert(`تمت إضافة (${prod.name}) بالكمية (${qty}) إلى السلة بنجاح يا أسطى! 🚀`);
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
