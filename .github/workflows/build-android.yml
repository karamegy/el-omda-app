name: Build El-Omda Native Android App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android App
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. استخراج ملف التوقيع Keystore تلقائياً
          KEYSTORE_DATA="${{ secrets.ANDROID_KEYSTORE_BASE64 }}"
          if [ -z "$KEYSTORE_DATA" ]; then
            KEYSTORE_DATA="${{ secrets.ANDROID_KEYSTORE }}"
          fi
          if [ -n "$KEYSTORE_DATA" ]; then
            echo "$KEYSTORE_DATA" | base64 --decode > signing.keystore
          fi

          # 2. تجهيز مجلد الويب www بنظافة ودون تكرار
          rm -rf www
          mkdir -p www
          find . -maxdepth 1 -type f ! -name ".*" -exec cp {} www/ \;
          if [ -d "assets" ]; then cp -r assets www/; fi

          # 3. إنشاء ملف تكوين Capacitor لتطبيق العمدة
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "io.github.karamegy.omda",
            "appName": "العمدة",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          # 4. تثبيت حزم Capacitor المطلوبة ومكتبة توثيق Firebase الأصلية
          npm install @capacitor/cli@latest @capacitor/core@latest @capacitor/android@latest @capacitor/filesystem @capacitor/share @capacitor/assets @capacitor-firebase/authentication@latest --save-dev

          # 5. بناء منصة أندرويد
          rm -rf android
          npx cap add android

          # 6. نقل ملف google-services.json تلقائياً إلى مجلد أندرويد
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/
          fi

          # 7. تجهيز توليد الأيقونات
          mkdir -p assets
          if [ -f "icon1-512.png" ]; then
            cp icon1-512.png assets/icon.png
            cp icon1-512.png assets/icon-only.png
          elif [ -f "logo.png" ]; then
            cp logo.png assets/icon.png
            cp logo.png assets/icon-only.png
          fi
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --android || true
          fi

          # 8. إعداد AndroidManifest.xml و file_paths
          mkdir -p android/app/src/main/res/xml/
          cat << 'EOF' > android/app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <external-path name="external_files" path="." />
              <cache-path name="cache_files" path="." />
              <files-path name="files_path" path="." />
          </paths>
          EOF

          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools"
              package="io.github.karamegy.omda">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.intent.action.VIEW" />
                      <data android:scheme="https" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  tools:overrideLibrary="com.getcapacitor.android">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name="io.github.karamegy.omda.MainActivity"
                      android:label="@string/title_activity_main"
                      android:theme="@style/AppTheme.NoActionBarLaunch"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="https" android:host="karamegy.github.io" android:pathPrefix="/el-omda-app" />
                      </intent-filter>
                  </activity>

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="io.github.karamegy.omda.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

              </application>

          </manifest>
          EOF

          # 9. إعداد ملف strings.xml
          mkdir -p android/app/src/main/res/values/
          cat << 'EOF' > android/app/src/main/res/values/strings.xml
          <?xml version='1.0' encoding='utf-8'?>
          <resources>
              <string name="app_name">العمدة</string>
              <string name="title_activity_main">العمدة</string>
              <string name="package_name">io.github.karamegy.omda</string>
              <string name="custom_url_scheme">io.github.karamegy.omda</string>
              <string name="file_provider_authority">io.github.karamegy.omda.fileprovider</string>
          </resources>
          EOF

          # 10. نقل ملف التوقيع وتكوين build.gradle المخصص
          if [ -f "signing.keystore" ]; then
            cp signing.keystore android/app/
          fi

          cat << 'EOF' > android/app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace "io.github.karamegy.omda"
              compileSdk 35

              defaultConfig {
                  applicationId "io.github.karamegy.omda"
                  minSdk 24
                  targetSdk 35
                  versionCode 10000
                  versionName "1.0.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_21
                  targetCompatibility JavaVersion.VERSION_21
              }

              signingConfigs {
                  release {
                      if (file('signing.keystore').exists()) {
                          storeFile file('signing.keystore')
                          storePassword System.getenv("KEYSTORE_PASSWORD")
                          keyAlias System.getenv("KEY_ALIAS")
                          keyPassword System.getenv("KEY_PASSWORD")
                      }
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }

          repositories {
              flatDir {
                  dirs 'libs'
              }
          }

          dependencies {
              implementation fileTree(dir: 'libs', include: ['*.jar'])
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation project(':capacitor-android')
          }

          try {
              def servicesJSON = file('google-services.json')
              if (servicesJSON.text) {
                  apply plugin: 'com.google.gms.google-services'
              }
          } catch(Exception e) {
              logger.info("google-services.json not found, google-services plugin not applied.")
          }
          EOF

          # 11. المزامنة والتجميع
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Bundle Artifact (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: elomda-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload APK Artifact (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: elomda-installable-apk
          path: android/app/build/outputs/apk/release/*.apk
