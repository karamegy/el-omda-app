name: Build Native Signed Android Package (TWA)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore Keystore File from Repository Secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

      - name: Build Android App Bundle (AAB) & APK
        run: |
          bubblewrap build --keyPath=release.keystore --keyAlias="${{ secrets.KEY_ALIAS }}" --keyPassword="${{ secrets.KEY_PASSWORD }}" --storePassword="${{ secrets.KEYSTORE_PASSWORD }}"

      - name: Upload Signed Android Artifacts (AAB & APK)
        uses: actions/upload-artifact@v4
        with:
          name: elomda-android-builds
          path: |
            *.apk
            *.aab
